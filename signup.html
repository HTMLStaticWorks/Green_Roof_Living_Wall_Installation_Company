<html lang="en" class="scroll-smooth">
<head>

    <title>Create Account | EcoArch Living Architecture</title>
    <meta name="description" content="Premium green roof and living wall installation company specializing in sustainable modern architecture.">

                            800: '#065f46',
                            900: '#064e3b',
                            950: '#022c22',
                        },
                        neutral: {
                            850: '#1f1f1f',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        heading: ['Outfit', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%23047857'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6'/></svg>">
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-800 dark:text-neutral-200 antialiased transition-colors duration-300 flex flex-col min-h-screen">
    <!-- Theme & RTL Toggles (Top Right) -->
    <div class="absolute top-6 right-6 flex items-center gap-3 z-50">
        <button id="theme-toggle-desktop"
            class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors text-neutral-500 dark:text-neutral-400 bg-white/80 dark:bg-neutral-900/80 backdrop-blur-md shadow-sm border border-neutral-200 dark:border-neutral-800"
            aria-label="Toggle Theme">
            <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" />
            </svg>
            <svg class="w-5 h-5 block dark:hidden" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
            </svg>
        </button>
        <button id="rtl-toggle-desktop"
            class="w-9 h-9 flex items-center justify-center text-[11px] font-bold tracking-wider border border-neutral-300 dark:border-neutral-600 rounded-full text-neutral-500 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors bg-white/80 dark:bg-neutral-900/80 backdrop-blur-md shadow-sm">
            RTL
        </button>
    </div>

<div class="min-h-screen flex items-center justify-center pt-24 pb-12 px-4 sm:px-6 lg:px-8 bg-white dark:bg-neutral-950 relative">
    <div class="max-w-md w-full space-y-8 p-10 border border-neutral-200 dark:border-neutral-800 rounded bg-neutral-50 dark:bg-neutral-900 shadow-sm relative z-10">
        <div>
            <div class="flex justify-center">
                <a href="index.html" class="flex-shrink-0 flex items-center gap-2 group">
                    <svg class="h-10 w-10 text-emerald-700 dark:text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span class="font-heading font-bold text-3xl tracking-tight text-neutral-900 dark:text-white">EcoArch</span>
                </a>
            </div>
            <h2 class="mt-8 text-center text-2xl font-semibold text-neutral-900 dark:text-white">Create an Account</h2>
        </div>
        <form class="mt-8 space-y-5" id="auth-form">
            <div>
                <label for="full-name" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Full Name</label>
                <input id="full-name" name="name" type="text" required class="appearance-none pr-10 block w-full px-4 py-3 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white bg-white dark:bg-neutral-950 rounded focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm transition-colors" placeholder="Full Name">
            </div>
            
            <div>
                <label for="email-address" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Email address</label>
                <input id="email-address" name="email" type="email" autocomplete="email" required class="appearance-none pr-10 block w-full px-4 py-3 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white bg-white dark:bg-neutral-950 rounded focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm transition-colors" placeholder="Email address">
            </div>
            
            <div>
                <label for="phone" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Phone Number</label>
                <input id="phone" name="phone" type="tel" required class="appearance-none pr-10 block w-full px-4 py-3 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white bg-white dark:bg-neutral-950 rounded focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm transition-colors" placeholder="Phone Number">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Password</label>
                
                    <div class="relative">
                        <input id="password" name="password" type="password" required class="appearance-none pr-10 block w-full px-4 py-3 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white bg-white dark:bg-neutral-950 rounded focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm transition-colors" placeholder="Password">
                        <button type="button" onclick="togglePassword('password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-neutral-500 hover:text-emerald-600 focus:outline-none z-10" aria-label="Toggle password visibility">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
            </div>
            
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Confirm Password</label>
                
                    <div class="relative">
                        <input id="confirm-password" name="confirm-password" type="password" required class="appearance-none pr-10 block w-full px-4 py-3 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white bg-white dark:bg-neutral-950 rounded focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm transition-colors" placeholder="Confirm Password">
                        <button type="button" onclick="togglePassword('confirm-password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-neutral-500 hover:text-emerald-600 focus:outline-none z-10" aria-label="Toggle password visibility">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
            </div>

            <div class="flex items-center">
                <input id="terms" name="terms" type="checkbox" required class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-neutral-300 rounded cursor-pointer">
                <label for="terms" class="ml-2 block text-sm text-neutral-700 dark:text-neutral-300 cursor-pointer">
                    I agree to the <a href="#" class="text-emerald-600 hover:text-emerald-500">Terms and Conditions</a>
                </label>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded text-white bg-neutral-900 hover:bg-neutral-800 dark:bg-emerald-600 dark:hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
                    Create Account
                </button>
            </div>
            
                        <div class="relative mt-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-neutral-300 dark:border-neutral-700"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-neutral-50 dark:bg-neutral-900 text-neutral-500">Or continue with</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-6">
                <button type="button" class="w-full inline-flex justify-center items-center py-2.5 px-4 border border-neutral-300 dark:border-neutral-700 rounded shadow-sm bg-white dark:bg-neutral-950 text-sm font-medium text-neutral-700 dark:text-neutral-300 hover:bg-neutral-50 dark:hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
                    <svg class="h-5 w-5 mr-2" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="w-full inline-flex justify-center items-center py-2.5 px-4 border border-neutral-300 dark:border-neutral-700 rounded shadow-sm bg-white dark:bg-neutral-950 text-sm font-medium text-neutral-700 dark:text-neutral-300 hover:bg-neutral-50 dark:hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
                    <svg class="h-5 w-5 mr-2 text-neutral-900 dark:text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.34-.73 3.69-.65 2.14.09 3.45.96 4.23 2.56-3.87 2.1-3.1 7.22.88 8.49-.64 1.4-1.57 2.84-2.88 3.77zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    Apple
                </button>
            </div>
            
            <div class="text-center text-sm text-neutral-600 dark:text-neutral-400 mt-4">
                Already have an account? <a href="login.html" class="font-medium text-emerald-600 hover:text-emerald-500 dark:text-emerald-400 transition-colors">Sign in</a>
            </div>
        </form>
    </div>
</div>
<script>
function togglePassword(fieldId) {
    var field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
    } else {
        field.type = "password";
    }
}
</script>
<script src="js/main.js"></script>
</body>
</html>
